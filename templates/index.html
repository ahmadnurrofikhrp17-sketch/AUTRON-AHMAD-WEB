<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AUTRON v0.4 - Web Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: #00ffcc; text-align: center; font-size: 28px; text-shadow: 0 0 10px #00ffcc; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 4px; border: none; box-sizing: border-box; }
        input { background: #2a2a2a; color: white; border: 1px solid #444; }
        button { background-color: #00ffcc; color: #121212; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #00cc99; box-shadow: 0 0 8px #00ffcc; }
        ul { list-style: none; padding: 0; }
        li { background: #2a2a2a; padding: 15px; margin: 10px 0; border-radius: 6px; border-left: 5px solid #00ffcc; }
        .mepet { border-left: 5px solid #ffcc00; }
        .terlambat { border-left: 5px solid #ff3333; }
        .info-sisa { font-size: 13px; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ AUTRON DASHBOARD v0.4 ⚡</h1>
        
        <!-- Form Tambah Tugas -->
        <div class="box">
            <h3>Tambahkan Tugas / Hafalan Kuliah</h3>
            <form action="/tambah" method="POST">
                <input type="text" name="nama" placeholder="Nama Tugas / Judul Hafalan" required>
                <input type="date" name="deadline" required>
                <button type="submit">Simpan ke Database JSON</button>
            </form>
        </div>

        <!-- Daftar Tugas -->
        <div class="box">
            <h3>Daftar Tugas Aktif</h3>
            <ul>
                {% for task in tasks %}
                    <li class="{{ task.status_kelas }}">
                        <strong>{{ task.nama }}</strong> <br>
                        <div class="info-sisa">
                            📅 Deadline: {{ task.deadline_tampil }} <br>
                            {{ task.pesan_sisa }}
                        </div>
                    </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body>
</html>
